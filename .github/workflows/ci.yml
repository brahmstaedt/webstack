name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint scripts and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Same script as locally: pinned shellcheck, YAML syntax, compose files in every mode.
      - name: test/lint.sh
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y -qq python3-yaml >/dev/null
          test/lint.sh

  end-to-end:
    name: End-to-end test (hosts, single, update and rollback)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          docker compose version
          command -v jq openssl curl

      - name: Run test/local-test.sh run
        shell: bash   # -eo pipefail: a failing test must fail the step despite the tee
        run: test/local-test.sh run 2>&1 | tee local-test.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-test-log
          path: local-test.log
          if-no-files-found: ignore
