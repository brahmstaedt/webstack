# Serves only the generated start page at "/". Everything else is 404.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
        # Static page without any script: forbid everything except the inline stylesheet and
        # embedded (data:) logo images.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
