# Local test only: copied into proxy/traefik/dynamic/ of the throwaway test copy by
# test/local-test.sh. Serves a wildcard certificate from a local test CA instead of
# Let's Encrypt (which cannot issue certificates for the reserved .test domain).
tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /certs/cert.pem
        keyFile: /certs/key.pem
